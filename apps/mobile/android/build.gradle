buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        // react-native-passkey requires API 28+ for Android Credential Manager
        // passkey support (see the online-attendance passkey plan).
        minSdkVersion = 28
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Fix: Configure subprojects safely whether they are already evaluated or not
subprojects { subproject ->
    def configureProject = {
        if (subproject.hasProperty("android")) {
            subproject.android {
                buildFeatures {
                    buildConfig = true
                }
            }
        }
    }

    if (subproject.state.executed) {
        configureProject()
    } else {
        subproject.afterEvaluate {
            configureProject()
        }
    }
}
